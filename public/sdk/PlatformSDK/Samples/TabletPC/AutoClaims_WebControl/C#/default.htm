<html>
    <script language="jscript">
        
        // Release any resouces held by the AutoClaims control
        function OnUnload()
        {
            autoClaimsControl.DisposeResources();
        }

    </script>
    <head>
        <title>AutoClaims (Web Control)</title>
        <META NAME="GENERATOR" Content="Microsoft Visual Studio 7.0">
    </head>
    <body onunload="OnUnload()">
        <object id="autoClaimsControl" classid="AutoClaims.dll#AutoClaims.AutoClaims" VIEWASTEXT>
        </object>
    </body>
</html>
